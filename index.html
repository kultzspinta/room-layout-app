<h1>けんもちくんの匠アプリ</h1>
<div id="room"
style="width:500px; height:350px;border:3px solid black;position:relative;">
    <div id="furniture"style="width:120px;height:60px;background:gray;position:absolute;left:100px;top:80px"></div></div>
<button onclick="alert('家具を動かすぞ！')">家具を動かす</button>
<script>
    const furniture = 
    document.getElementById("furniture");
    const room =
        document.getElementById("room");
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;
    furniture.addEventListener("mousedown",
    function(event){
        isDragging = true;
        offsetX = event.offsetX;
        offsetY = event.offsetY;
    });

    document.addEventListener("mousemove",
        function(event){
            if(isDragging){
            furniture.style.left = 
                (event.clientX - offsetX) + "px";
            furniture.style.top = 
                (event.clientY - offsetY) + "px";
        }
    }
    );
    document.addEventListener("mouseup",
    function(){
        isDragging = false;
    });
    </script>
