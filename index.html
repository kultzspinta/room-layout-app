<h1>Room Layout App Ver.0.1</h1>
<div id="room"
style="width:500px; height:350px;border:3px solid black;position:relative;">
    
    <div id="furniture"
        
style="width:120px;height:60px;background:gray;position:absolute;left:100px;top:80px"></div>
    
    <div id="furniture2"

style="width:80px;height:80px;background:skyblue;position:absolute;left:250px;top:150px;">

    </div>

</div>

<button onclick="alert('家具を動かすぞ！')">家具を動かす</button>

<script>
alert("Javascript起動確認");

const furniture = 
document.getElementById("furniture");
const room =
document.getElementById("room");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;

furniture.style.touchAction = "none";

furniture.addEventListener("pointerdown",
    function(event){
        isDragging = true;

        const rect = 
furniture.getBoundingClientRect();

        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;
    
    furniture.setPointerCapture(event.pointerId)
    ;
    });

    furniture.addEventListener("pointermove",
    function(event){
        if(!isDragging) return;

        const roomRect = 
    room.getBoundingClientRect();

        const x = event.clientX - roomRect.left
            - room.clientLeft - offsetX;
        const y = event.clientY - roomRect.top
            - room.clientTop - offsetY;

        furniture.style.left =
            Math.max(0,
                Math.min(room.clientWidth - 
    furniture.offsetWidth, x)
            ) + "px";
        
        furniture.style.top =
            Math.max(0,
                Math.min(room.clientHeight -
    furniture.offsetHeight, y)
            ) + "px";
    });

    function stopDragging(){
        isDragging = false;
    }

    furniture.addEventListener("pointerup",
    stopDragging);
    furniture.addEventListener("pointercancel",
    stopDragging);
    </script>
