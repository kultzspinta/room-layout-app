<h1>Room Layout App Ver.0.1</h1>
<div id="room"
style="width:500px; height:350px;border:3px solid black;position:relative;">
    
    <div id="furniture"
        
style="width:120px;height:60px;background:gray;position:absolute;left:100px;top:80px"></div>
    
    <div id="furniture2"

style="width:80px;height:80px;background:skyblue;position:absolute;left:250px;top:150px;">

    </div>

</div>

<button id="rotateButton">90度回転</button>
<button id="addButton">家具を追加</button>
<button id="deleteButton">選択した家具を削除</button>

<script>
alert("Javascript起動確認");

const room =
document.getElementById("room");

let roomWidthCm = 400;
let roomDepthCm = 280;

const pixelsPerCm = 500 / roomWidthCm;

alert("1cm =",pixelsPerCm,"px");

let furnitureList = [
    document.getElementById("furniture"),
    document.getElementById("furniture2")
];

let selectedFurniture = null;

function setupFurniture(furniture){
let isDragging = false;
let offsetX = 0;
let offsetY = 0;

furniture.style.touchAction = "none";

furniture.addEventListener("pointerdown",
    function(event){
            if(selectedFurniture){
                selectedFurniture.style.outline =
    "none";
            }

            selectedFurniture = furniture;
            selectedFurniture.style.outline = 
    "3px solid red";

        isDragging = true;

        const rect = 
furniture.getBoundingClientRect();

        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;
    
    furniture.setPointerCapture(event.pointerId)
    ;
    });

    furniture.addEventListener("pointermove",
    function(event){
        if(!isDragging) return;

        const roomRect = 
    room.getBoundingClientRect();

        const x = event.clientX - roomRect.left
            - room.clientLeft - offsetX;
        const y = event.clientY - roomRect.top
            - room.clientTop - offsetY;

        furniture.style.left =
            Math.max(0,
                Math.min(room.clientWidth - 
    furniture.offsetWidth, x)
            ) + "px";
        
        furniture.style.top =
            Math.max(0,
                Math.min(room.clientHeight -
    furniture.offsetHeight, y)
            ) + "px";
    });

    function stopDragging(){
        isDragging = false;
    }

    furniture.addEventListener("pointerup",
    stopDragging);
    furniture.addEventListener("pointercancel",
    stopDragging);
    }

    furnitureList.forEach(setupFurniture);

    document.getElementById("rotateButton")
        .addEventListener("click",function(){
            if(!selectedFurniture) return;

            const oldWidth = 
    selectedFurniture.offsetWidth;
            const oldHeight =
    selectedFurniture.offsetHeight;

            selectedFurniture.style.width = 
    oldHeight + "px";
            selectedFurniture.style.height =
    oldWidth + "px";

            const maxX = room.clientWidth - 
    selectedFurniture.offsetWidth;
            const maxY = room.clientHeight - 
    selectedFurniture.offsetHeight;

            selectedFurniture.style.left = 
                Math.max(0,Math.min(maxX,
    selectedFurniture.offsetLeft)) + "px";
            selectedFurniture.style.top =
                Math.max(0,Math.min(maxY,
            selectedFurniture.offsetTop)) + "px";
                });

    document.getElementById("addButton")
        .addEventListener("click", function(){

            const newFurniture = 
    document.createElement("div");

            newFurniture.style.width = "100px";
            newFurniture.style.height = "60px";
            newFurniture.style.background = "tan";
            newFurniture.style.position = "absolute";
            newFurniture.style.left = "20px";
            newFurniture.style.top = "20px";

            room.appendChild(newFurniture);

            furnitureList.push(newFurniture);
            setupFurniture(newFurniture);
        });

    document.getElementById("deleteButton")
        .addEventListener("click", function(){

            if (!selectedFurniture) return;

            selectedFurniture.remove();

            const index =
    furnitureList.indexOf(selectedFurniture);

            if (index !== -1) {
                furnitureList.splice(index, 1);
            }

            selectedFurniture = null;
        });

    </script>
