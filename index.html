<h1>けんもちくんの匠アプリ Ver.0.1</h1>
<div id="room"
style="width:500px; height:350px;border:3px solid black;position:relative;">
    <div id="furniture"
        style="width:120px;height:60px;background:gray;position:absolute;left:100px;top:80px"></div></div>
    <div id="furniture2"
        style="width:80px;height:80pk;background:skyblue;position:absolute;left:250px;top:150px;"></div></div>
    <button onclick="alert('家具を動かすぞ！')">家具を動かす</button>
<script>
    const furniture = 
    document.getElementById("furniture");
    const room =
        document.getElementById("room");
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;
    furniture.addEventListener("mousedown",
    function(event){
        isDragging = true;
        offsetX = event.offsetX;
        offsetY = event.offsetY;
    });

    document.addEventListener("mousemove",
        function(event){
            if(isDragging){
                const roomRect = 
                room.getBoundingClientRect();
            furniture.style.left = 
                Math.max(0, Math.min(room.clientWidth - furniture.offsetWidth, event.clientX - roomRect.left - room.clientLeft - offsetX)) + "px";
            furniture.style.top = 
                Math.max(0, Math.min(room.clientHeight - furniture.offsetHeight,event.clientY - roomRect.top - room.clientTop - offsetY)) + "px";
        }
    }
    );
    document.addEventListener("mouseup",
    function(){
        isDragging = false;
    });
    </script>
